name: RickAndMorty
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release
configFiles:
  Debug-Dev: Configurations/Debug-Dev.xcconfig
  Release-Dev: Configurations/Release-Dev.xcconfig
  Debug-Prod: Configurations/Debug-Prod.xcconfig
  Release-Prod: Configurations/Release-Prod.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  RickAndMorty:
    type: application
    platform: iOS
    sources: [RickAndMorty]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RickAndMorty
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RickAndMorty/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Rick & Morty"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  RickAndMortyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RickAndMortyTests]
    dependencies:
      - target: RickAndMorty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RickAndMortyTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dev:
    build:
      targets:
        RickAndMorty: all
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets: [RickAndMortyTests]
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Prod:
    build:
      targets:
        RickAndMorty: all
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
      targets: [RickAndMortyTests]
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
